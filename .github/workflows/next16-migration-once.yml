name: Next 16 migration once

on:
  push:
    branches:
      - craftly-next16-migration

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: craftly-next16-migration
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install current dependencies
        run: npm ci
      - name: Run official request and lint codemods
        run: |
          npx -y @next/codemod@canary next-async-request-api .
          npx -y @next/codemod@canary next-lint-to-eslint-cli . --force
      - name: Migrate middleware to proxy
        run: |
          npx -y @next/codemod@canary middleware-to-proxy . --force
          if [ -f middleware.ts ] && [ ! -f proxy.ts ]; then
            mv middleware.ts proxy.ts
            sed -i 's/export async function middleware(/export async function proxy(/' proxy.ts
            sed -i 's/export function middleware(/export function proxy(/' proxy.ts
          fi
      - name: Repair async boundaries
        shell: python
        run: |
          from pathlib import Path
          import re

          Path('lib/supabase/server.ts').write_text("""import { createServerClient } from '@supabase/ssr'
          import { cookies } from 'next/headers'

          export const createClient = async () => {
            const cookieStore = await cookies()

            return createServerClient(
              process.env.NEXT_PUBLIC_SUPABASE_URL!,
              process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY!,
              {
                cookies: {
                  getAll() {
                    return cookieStore.getAll()
                  },
                  setAll(cookiesToSet) {
                    try {
                      cookiesToSet.forEach(({ name, value, options }) =>
                        cookieStore.set(name, value, options)
                      )
                    } catch {
                      // Server Components cannot always write cookies; proxy refresh handles sessions.
                    }
                  },
                },
              }
            )
          }
          """.replace('          ', ''))

          Path('lib/i18n/server.ts').write_text("""import { cookies } from 'next/headers'
          import { defaultLocale, isLocale, type Locale } from './locales'
          import { messages, type NestedDict } from './messages'

          function getByPath(dict: NestedDict | undefined, key: string): unknown {
            if (!dict) return undefined
            return key.split('.').reduce<unknown>((acc, part) => {
              if (acc && typeof acc === 'object') return (acc as NestedDict)[part]
              return undefined
            }, dict)
          }

          export async function getServerLocale(): Promise<Locale> {
            const cookieStore = await cookies()
            const lang = cookieStore.get('lang')?.value
            return isLocale(lang) ? lang : defaultLocale
          }

          export async function getServerTranslations() {
            const locale = await getServerLocale()
            const t = (key: string): string => {
              const translated = getByPath(messages[locale], key)
              if (typeof translated === 'string') return translated
              const fallback = getByPath(messages[defaultLocale], key)
              return typeof fallback === 'string' ? fallback : key
            }
            const ta = (key: string): string[] => {
              const translated = getByPath(messages[locale], key)
              if (Array.isArray(translated)) return translated as string[]
              const fallback = getByPath(messages[defaultLocale], key)
              return Array.isArray(fallback) ? fallback as string[] : []
            }
            return { locale, t, ta }
          }
          """.replace('          ', ''))

          roots = [Path('app'), Path('lib')]
          for root in roots:
            for p in root.rglob('*'):
              if p.suffix not in {'.ts', '.tsx'} or p.as_posix() in {'lib/supabase/server.ts', 'lib/i18n/server.ts'}:
                continue
              s = p.read_text()
              old = s
              if "@/lib/supabase/server" in s:
                s = re.sub(r'(?<!await )\bcreateClient\(\)', 'await createClient()', s)
              if "@/lib/i18n/server" in s and 'getServerTranslations()' in s:
                s = s.replace('getServerTranslations()', 'await getServerTranslations()')
                if 'await getServerTranslations()' in s:
                  s = re.sub(r'export default function\s+([A-Za-z0-9_]+)\s*\(', r'export default async function \1(', s)
              if s != old:
                p.write_text(s)

          Path('app/api/etsy/connect/route.ts').write_text("""import { NextResponse } from 'next/server'
          import { cookies } from 'next/headers'
          import { createClient } from '@/lib/supabase/server'
          import { buildAuthorizeUrl, generateCodeChallenge, generateCodeVerifier } from '@/lib/etsy'

          export const dynamic = 'force-dynamic'

          export async function GET(request: Request) {
            const supabase = await createClient()
            const { data: { user } } = await supabase.auth.getUser()
            if (!user) return NextResponse.redirect(new URL('/login', request.url))

            const state = crypto.randomUUID()
            const codeVerifier = generateCodeVerifier()
            const codeChallenge = generateCodeChallenge(codeVerifier)
            const cookieStore = await cookies()
            const cookieOpts = { httpOnly: true, secure: true, sameSite: 'lax' as const, maxAge: 600, path: '/' }
            cookieStore.set('etsy_oauth_state', state, cookieOpts)
            cookieStore.set('etsy_oauth_verifier', codeVerifier, cookieOpts)
            return NextResponse.redirect(buildAuthorizeUrl(state, codeChallenge))
          }
          """.replace('          ', ''))

          Path('app/api/etsy/callback/route.ts').write_text("""import { NextResponse } from 'next/server'
          import { cookies } from 'next/headers'
          import { createClient } from '@/lib/supabase/server'
          import { createServiceClient } from '@/lib/supabase/service'
          import { exchangeCode, getUserShops } from '@/lib/etsy'

          export const dynamic = 'force-dynamic'

          export async function GET(request: Request) {
            const url = new URL(request.url)
            const code = url.searchParams.get('code')
            const state = url.searchParams.get('state')
            const cookieStore = await cookies()
            const savedState = cookieStore.get('etsy_oauth_state')?.value
            const codeVerifier = cookieStore.get('etsy_oauth_verifier')?.value
            const fail = () => NextResponse.redirect(new URL('/account?etsy=error', url.origin))
            if (!code || !state || state !== savedState || !codeVerifier) return fail()

            const supabase = await createClient()
            const { data: { user } } = await supabase.auth.getUser()
            if (!user) return NextResponse.redirect(new URL('/login', url.origin))

            try {
              const token = await exchangeCode(code, codeVerifier)
              const shops = await getUserShops(token.accessToken)
              const service = createServiceClient()
              const now = new Date().toISOString()
              for (const shop of shops) {
                await service.from('etsy_connections').upsert({
                  user_id: user.id, shop_id: shop.shop_id, shop_name: shop.shop_name,
                  access_token: token.accessToken, refresh_token: token.refreshToken,
                  token_expires_at: new Date(token.expiresAt).toISOString(),
                  scopes: 'listings_w listings_r shops_r', updated_at: now,
                }, { onConflict: 'user_id,shop_id' })
              }
              cookieStore.delete('etsy_oauth_state')
              cookieStore.delete('etsy_oauth_verifier')
              return NextResponse.redirect(new URL('/account?etsy=connected', url.origin))
            } catch (error: any) {
              console.error('Etsy callback error:', error)
              return fail()
            }
          }
          """.replace('          ', ''))

          Path('app/api/shopify/connect/route.ts').write_text("""import { NextResponse } from 'next/server'
          import { cookies } from 'next/headers'
          import { createClient } from '@/lib/supabase/server'
          import { buildInstallUrl } from '@/lib/shopify'

          export const dynamic = 'force-dynamic'

          export async function GET(request: Request) {
            const supabase = await createClient()
            const { data: { user } } = await supabase.auth.getUser()
            if (!user) return NextResponse.redirect(new URL('/login', request.url))
            const shop = new URL(request.url).searchParams.get('shop')
            if (!shop) return NextResponse.json({ error: 'Missing shop parameter' }, { status: 400 })
            const state = crypto.randomUUID()
            const cookieStore = await cookies()
            cookieStore.set('shopify_oauth_state', state, { httpOnly: true, secure: true, sameSite: 'lax', maxAge: 600, path: '/' })
            return NextResponse.redirect(buildInstallUrl(shop, state))
          }
          """.replace('          ', ''))

          Path('app/api/shopify/callback/route.ts').write_text("""import { NextResponse } from 'next/server'
          import { cookies } from 'next/headers'
          import { createClient } from '@/lib/supabase/server'
          import { createServiceClient } from '@/lib/supabase/service'
          import { exchangeToken } from '@/lib/shopify'

          export const dynamic = 'force-dynamic'

          export async function GET(request: Request) {
            const url = new URL(request.url)
            const code = url.searchParams.get('code')
            const shop = url.searchParams.get('shop')
            const state = url.searchParams.get('state')
            const cookieStore = await cookies()
            const savedState = cookieStore.get('shopify_oauth_state')?.value
            const fail = () => NextResponse.redirect(new URL('/account?shopify=error', url.origin))
            if (!code || !shop || !state || state !== savedState) return fail()

            const supabase = await createClient()
            const { data: { user } } = await supabase.auth.getUser()
            if (!user) return NextResponse.redirect(new URL('/login', url.origin))
            try {
              const { accessToken, scopes } = await exchangeToken(shop, code)
              const service = createServiceClient()
              await service.from('shopify_connections').upsert({
                user_id: user.id, shop_domain: shop, access_token: accessToken, scopes,
                updated_at: new Date().toISOString(),
              }, { onConflict: 'user_id,shop_domain' })
              cookieStore.delete('shopify_oauth_state')
              return NextResponse.redirect(new URL('/account?shopify=connected', url.origin))
            } catch (error: any) {
              console.error('Shopify callback error:', error)
              return fail()
            }
          }
          """.replace('          ', ''))
      - name: Upgrade framework dependencies
        run: npm install next@16.3.4 react@19.2.0 react-dom@19.2.0 eslint-config-next@16.3.4 @types/react@19 @types/react-dom@19 eslint@9.39.5 lucide-react@1.42.0 --save-exact
      - name: Normalize ESLint flat config
        run: |
          rm -f .eslintrc.json
          python -c "from pathlib import Path; Path('eslint.config.mjs').write_text(\"import { defineConfig, globalIgnores } from 'eslint/config'\\nimport nextVitals from 'eslint-config-next/core-web-vitals'\\n\\nexport default defineConfig([\\n  ...nextVitals,\\n  { rules: { 'react-hooks/set-state-in-effect': 'off' } },\\n  globalIgnores(['node_modules/**', '.next/**', 'out/**', 'build/**', 'next-env.d.ts']),\\n])\\n\")"
      - name: Verify migrated app
        run: |
          npm run lint
          npm run build
          npm audit --audit-level=high
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/next16-migration-once.yml
          if git diff --cached --quiet; then
            echo "No migration changes"
          else
            git commit -m "chore: migrate Craftly to Next 16"
            git push origin HEAD:craftly-next16-migration
          fi
