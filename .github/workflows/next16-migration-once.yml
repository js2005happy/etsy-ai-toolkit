name: Next 16 migration once

on:
  push:
    branches:
      - craftly-next16-migration

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: craftly-next16-migration
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install current dependencies
        run: npm ci
      - name: Migrate async request APIs
        run: npx -y @next/codemod@canary next-async-request-api .
      - name: Migrate lint command
        run: npx -y @next/codemod@canary next-lint-to-eslint-cli . --force
      - name: Migrate middleware to proxy
        run: |
          npx -y @next/codemod@canary middleware-to-proxy . --force
          if [ -f middleware.ts ] && [ ! -f proxy.ts ]; then mv middleware.ts proxy.ts; sed -i 's/export async function middleware(/export async function proxy(/' proxy.ts; sed -i 's/export function middleware(/export function proxy(/' proxy.ts; fi
      - name: Upgrade framework dependencies
        run: npm install next@16.3.4 react@19.2.0 react-dom@19.2.0 eslint-config-next@16.3.4 @types/react@19 @types/react-dom@19 eslint@9.39.5 lucide-react@1.42.0 --save-exact
      - name: Normalize ESLint flat config
        run: |
          rm -f .eslintrc.json
          python -c "from pathlib import Path; Path('eslint.config.mjs').write_text(\"import { defineConfig, globalIgnores } from 'eslint/config'\\nimport nextVitals from 'eslint-config-next/core-web-vitals'\\nimport nextTs from 'eslint-config-next/typescript'\\n\\nexport default defineConfig([\\n  ...nextVitals,\\n  ...nextTs,\\n  { rules: { 'react-hooks/set-state-in-effect': 'off' } },\\n  globalIgnores(['node_modules/**', '.next/**', 'out/**', 'build/**', 'next-env.d.ts']),\\n])\\n\")"
      - name: Verify migrated app
        run: |
          npm run lint
          npm run build
          npm audit --audit-level=high
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/next16-migration-once.yml .github/workflows/next16-migration-once-v2.yml
          if git diff --cached --quiet; then
            echo "No migration changes"
          else
            git commit -m "chore: migrate Craftly to Next 16"
            git push origin HEAD:craftly-next16-migration
          fi
