name: One-time dependency and claims audit

on:
  push:
    branches:
      - craftly-reliability-conversion

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: craftly-reliability-conversion

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report dependency audit
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); console.log('AUDIT_METADATA',JSON.stringify(a.metadata?.vulnerabilities||{})); for(const [n,v] of Object.entries(a.vulnerabilities||{})){if(['high','critical'].includes(v.severity)) console.log('AUDIT_ITEM',JSON.stringify({name:n,severity:v.severity,isDirect:v.isDirect,range:v.range,via:v.via,effects:v.effects,fixAvailable:v.fixAvailable}))}"

      - name: Remove unsupported claims
        run: python scripts/claims_cleanup.py

      - name: Commit claims cleanup
        run: |
          rm -f audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/tools/free-etsy-title-generator/page.tsx
          if git diff --cached --quiet; then
            echo "No content changes needed"
          else
            git commit -m "fix: remove unsupported Etsy marketing claims"
            git push origin HEAD:craftly-reliability-conversion
          fi
