name: Quality

on:
  pull_request:
  push:
    branches:
      - craftly-reliability-conversion

jobs:
  lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
      NEXT_PUBLIC_PADDLE_ENV: sandbox
      NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: test_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
