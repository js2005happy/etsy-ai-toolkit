name: PR3 finalize once

on:
  push:
    branches:
      - craftly-next16-migration

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: craftly-next16-migration
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Clean pricing navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path('components/pricing/pricing-client.tsx')
          s = p.read_text()
          s = s.replace("import Link from 'next/link'\n", "import Link from 'next/link'\nimport { useRouter } from 'next/navigation'\n")
          s = s.replace("  const { t } = useI18n()\n", "  const { t } = useI18n()\n  const router = useRouter()\n", 1)
          s = s.replace("          window.location.href = '/welcome'", "          router.push('/welcome')")
          s = s.replace("        window.location.href = '/signup'", "        router.push('/signup')")
          s = s.replace("    [paddle, period, userEmail, userId]", "    [paddle, period, router, userEmail, userId]")
          s = s.replace("  }, [])", "  }, [router])", 1)
          p.write_text(s)
      - name: Verify
        run: |
          npm ci
          npm run lint
          npm run build
          npm audit --audit-level=high
      - name: Commit and remove one-time workflow
        run: |
          rm .github/workflows/pr3-finalize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/pricing/pricing-client.tsx .github/workflows/pr3-finalize-once.yml
          git commit -m "fix: align pricing navigation with Next 16"
          git push origin HEAD:craftly-next16-migration
